name: PostgreSQL concurrency
on:
  pull_request:
  workflow_dispatch:
jobs:
  postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mdsafe_test
          POSTGRES_USER: mdsafe_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mdsafe_test -d mdsafe_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ci-only-django-key
      ALLOWED_HOSTS: localhost
      POSTGRES_DB: mdsafe_test
      POSTGRES_USER: mdsafe_test
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      AUDIT_HMAC_KEY: ci-only-audit-key
      SIGNATURE_HMAC_KEY: ci-only-signature-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q -m postgres tests/test_compliance_security.py
