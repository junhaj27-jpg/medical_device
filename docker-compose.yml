services:
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py seed_demo_data && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    ports: ["8000:8000"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: mdsafe
      POSTGRES_USER: mdsafe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST: db
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?AUDIT_HMAC_KEY must be set}
      SIGNATURE_HMAC_KEY: ${SIGNATURE_HMAC_KEY:?SIGNATURE_HMAC_KEY must be set}
      PRIVATE_MEDIA_ROOT: /app/private_media
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?DEMO_ADMIN_PASSWORD must be set}
      DEMO_RA_PASSWORD: ${DEMO_RA_PASSWORD:?DEMO_RA_PASSWORD must be set}
      DEMO_STAFF_PASSWORD: ${DEMO_STAFF_PASSWORD:?DEMO_STAFF_PASSWORD must be set}
    depends_on: [db]
    volumes: [private_media:/app/private_media]
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: mdsafe, POSTGRES_USER: mdsafe, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"}
    volumes: [postgres_data:/var/lib/postgresql/data]
volumes: {postgres_data: {}, private_media: {}}
