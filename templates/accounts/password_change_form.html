{% extends "base.html" %}
{% block title %}비밀번호 변경 | MDSafe{% endblock %}
{% block heading %}비밀번호 변경{% endblock %}
{% block content %}
<div class="panel form-panel">
  <h2>새 비밀번호 설정</h2>
  <p class="muted">현재 비밀번호를 확인한 뒤 안전한 새 비밀번호를 입력해 주세요.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="primary" type="submit">비밀번호 변경</button>
  </form>
</div>
{% endblock %}
